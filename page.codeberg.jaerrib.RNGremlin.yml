id: page.codeberg.jaerrib.RNGremlin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
base: org.godotengine.godot.BaseApp
base-version: '4.7'
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: RNGremlin
    buildsystem: simple

    sources:
      - type: git
        url: https://codeberg.org/jaerrib/RNGremlin.git
        tag: 2.1.1
        commit: b13de2a576ba7c78cca9c320dbfe3edc620a4d5c

      - type: file
        url: https://codeberg.org/jaerrib/RNGremlin/releases/download/2.1.1/RNGremlin-2.1.1.pck
        dest-filename: RNGremlin.pck
        sha256: fe8ce100dc2a9ba7d49957fbbf4376f399cbeb548f30b7aa76d6753214fa29b3

    build-commands:
      - install -Dm644 RNGremlin.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
